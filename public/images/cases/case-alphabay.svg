<svg viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#080B12" />
  <defs>
    <pattern id="alphaGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#253044" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="1.5" fill="#8B5CF6" opacity="0.4" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#alphaGrid)" />
  <rect x="40" y="40" width="1120" height="550" rx="8" stroke="#253044" stroke-width="1.5" />
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#253044" stroke-width="1" />
  <text x="70" y="75" font-family="Courier, monospace" font-size="14" fill="#8B5CF6" letter-spacing="2">CASE FILE: CE-2017-07 // SECTOR: DARKNET_OPERATIONS</text>
  <text x="960" y="75" font-family="Courier, monospace" font-size="14" fill="#38BDF8" letter-spacing="1">OPERATION: BAYONET (FBI/DEA)</text>
  
  <!-- Server / OPSEC Failure Diagram -->
  <g transform="translate(180, 180)">
    <rect x="40" y="60" width="220" height="130" rx="6" fill="#111827" stroke="#8B5CF6" stroke-width="2" />
    <text x="150" y="95" font-family="Courier, monospace" font-size="12" fill="#8B5CF6" text-anchor="middle">ALPHABAY CLUSTER</text>
    <text x="150" y="125" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Tor Hidden Service v2</text>
    <text x="150" y="150" font-family="Courier, monospace" font-size="10" fill="#EF4444" text-anchor="middle">Pravatt@gmail.com OPSEC LEAK</text>
    
    <path d="M260 125 L450 125" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="450,125 440,120 440,130" fill="#EF4444" />
    <text x="350" y="115" font-family="Courier, monospace" font-size="11" fill="#EF4444" text-anchor="middle">WELCOME EMAIL HEADER</text>
    
    <rect x="470" y="60" width="260" height="130" rx="6" fill="#111827" stroke="#253044" stroke-width="2" />
    <text x="600" y="95" font-family="Courier, monospace" font-size="12" fill="#38BDF8" text-anchor="middle">PHYSICAL INFRASTRUCTURE</text>
    <text x="600" y="125" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#E5E7EB" text-anchor="middle">Quebec &amp; Bangkok Raid</text>
    <text x="600" y="150" font-family="Courier, monospace" font-size="10" fill="#10B981" text-anchor="middle">Unencrypted Mac Mini Captured</text>
  </g>
  
  <text x="70" y="540" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF">Operation Bayonet: The Fall of AlphaBay and Alexandre Cazes</text>
  <text x="70" y="568" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">Deconstructing the fatal OPSEC failure in automated forum mailers that unmasked the dark web's largest marketplace</text>
